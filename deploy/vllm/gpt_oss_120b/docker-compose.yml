version: "3.9"

services:
  gpt_oss_120b:
    image: vllm/vllm-openai:gptoss
    container_name: gpt_oss_120b
    restart: unless-stopped
    gpus: all

    ports:
      - "${PORT:-9001}:8000"

    ipc: host

    environment:
      # Example: pin a single GPU
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    volumes:
      - ${MODEL_DIR:-/data/models/openai-gpt-oss-120b}:/workspace/gpt_oss_120b:ro
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    command: >
      --model /workspace/gpt_oss_120b
      --served-model-name ${SERVED_MODEL_NAME:-gpt_oss_120b}
      --tensor-parallel-size ${TP_SIZE:-1}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.95}
      --max-model-len ${MAX_MODEL_LEN:-8192}
      --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
      --swap-space ${SWAP_SPACE_GB:-8}
      --api-key ${VLLM_API_KEY:-my-secret-key}


