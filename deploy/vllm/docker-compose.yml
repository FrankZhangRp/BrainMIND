version: "3.9"

services:
  vllm:
    image: vllm/vllm-openai:v0.8.4
    container_name: vllm-openai-server
    restart: unless-stopped

    # Requires NVIDIA Container Toolkit + Docker Compose v2+
    # You can also set NVIDIA_VISIBLE_DEVICES below to pin GPUs.
    gpus: all

    ports:
      - "${VLLM_PORT:-8000}:8000"

    # Large models benefit from a bigger shared memory segment.
    shm_size: "${SHM_SIZE:-20gb}"
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    volumes:
      # Model folder on host -> /models in container
      - ${MODEL_DIR:-/data/models}:/models:ro
      # Optional HF cache (for remote code / tokenizer files)
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    command:
      - "python"
      - "-m"
      - "vllm.entrypoints.openai.api_server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--model"
      - "${MODEL_PATH:-/models/your-model}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-model}"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-1}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-8192}"
      - "--api-key"
      - "${VLLM_API_KEY:-my-secret-key}"

